<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>국궁 동호회 대시보드</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<!-- 인증 확인 전까지 화면을 숨김 (auth-pending) -->
<body class="auth-pending">
  <div class="layout">
    <!-- PC: 왼쪽 사이드바 / 모바일: 하단 탭바 -->
    <nav class="sidebar" aria-label="주 메뉴">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">弓</span>
        <div>
          <strong>Gungdo Club</strong>
          <small>기록 관리</small>
        </div>
      </div>
      <ul class="nav-list">
        <li><a href="#/dashboard" data-route="dashboard"><span class="nav-ico">◎</span><span>대시보드</span></a></li>
        <li><a href="#/records"   data-route="records"><span class="nav-ico">✎</span><span>기록 입력</span></a></li>
        <li><a href="#/history"   data-route="history"><span class="nav-ico">▤</span><span>기록 조회</span></a></li>
        <li><a href="#/players"   data-route="players"><span class="nav-ico">☰</span><span>선수 관리</span></a></li>
      </ul>
      <button id="logout-btn" class="btn btn-ghost sidebar-logout" type="button">로그아웃</button>
    </nav>

    <div class="main">
      <header class="topbar">
        <h1 id="page-title">대시보드</h1>
        <button id="logout-btn-mobile" class="btn btn-ghost btn-sm" type="button">로그아웃</button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
