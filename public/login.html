<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · 국궁 동호회</title>
  <!-- 아이콘 / 홈 화면 추가 -->
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f7f3ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="활 배웁니다" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand brand-lg">
      <span class="brand-mark" aria-hidden="true">弓</span>
      <div>
        <strong>Gungdo Club</strong>
        <small>국궁 동호회 기록 관리</small>
      </div>
    </div>

    <form id="login-form" class="form" novalidate>
      <label class="field">
        <span>이메일</span>
        <input type="email" name="email" autocomplete="username" required />
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <p id="login-error" class="form-error" role="alert"></p>
      <button type="submit" class="btn btn-primary btn-block">로그인</button>
    </form>
    <p class="login-note">관리자 전용 페이지입니다.</p>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
